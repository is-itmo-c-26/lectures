<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img"><title>Перемещение: исходный объект становится пустым, новый объект получает прежний массив без копирования элементов.</title><defs><marker id="087f8c" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087f8c"/></marker><marker id="b83a42" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b83a42"/></marker><marker id="265eae" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#265eae"/></marker></defs><rect width="1100" height="400" rx="18" fill="white"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="27" fill="#20303c" font-weight="700" text-anchor="start">До перемещения</text><text x="590" y="40" font-family="Arial, sans-serif" font-size="27" fill="#20303c" font-weight="700" text-anchor="start">После перемещения</text><path d="M550 65 V365" stroke="#d8e0e6" stroke-width="2"/><rect x="30" y="85" width="225" height="100" rx="15" fill="#f4f8fa" stroke="#087f8c" stroke-width="3"/><text x="52" y="124" font-family="Arial, sans-serif" font-size="28" fill="#087f8c" font-weight="700" text-anchor="start">first</text><text x="52" y="160" font-family="Arial, sans-serif" font-size="23" fill="#20303c" font-weight="400" text-anchor="start">size_ = 2</text><text x="295" y="80" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700" text-anchor="start">массив</text><rect x="295" y="97" width="220" height="76" rx="12" fill="#e5f2f3" stroke="#087f8c" stroke-width="3"/><path d="M 405 97 v 76" stroke="#087f8c" stroke-width="2"/><text x="350" y="146" font-family="Arial, sans-serif" font-size="29" fill="#20303c" font-weight="400" text-anchor="middle">7</text><text x="460" y="146" font-family="Arial, sans-serif" font-size="29" fill="#20303c" font-weight="400" text-anchor="middle">0</text><path d="M255 135 L28
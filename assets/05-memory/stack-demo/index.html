<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вызов функции: регистры и стек</title>
<link rel="stylesheet" href="style.css">
<script src="trace.js" defer></script>
<script src="player.js" defer></script>
</head>
<body>
<main>
  <header><span class="eyebrow">x86-64 · System V · add(40, 2)</span><span id="counter"></span></header>
  <div class="instruction-bar"><strong id="instruction"></strong><span id="next-instruction"></span></div>
  <svg id="scene" viewBox="0 0 1280 360" role="img" aria-labelledby="scene-title scene-description">
    <title id="scene-title">Регистры процессора и ячейки стека</title>
    <desc id="scene-description">Регистры сверху, стек снизу. Адреса растут вправо, стек растёт влево. Красным отмечены изменения текущего шага.</desc>
    <defs>
      <linearGradient id="register-fill" x2="0" y2="1"><stop stop-color="#536168"/><stop offset="1" stop-color="#29363b"/></linearGradient>
      <linearGradient id="local-fill" x2="1" y2="1"><stop stop-color="#f1e9d8"/><stop offset="1" stop-color="#d7ba87"/></linearGradient>
      <linearGradient id="saved-fill" x2="1" y2="1"><stop stop-color="#e6f3f6"/><stop offset="1" stop-color="#a6ccd7"/></linearGradient>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34464d"/></marker>
      <marker id="red-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e91c57"/></marker>
    </defs>
    <g id="cells"></g><g id="registers"></g>
    <path id="rsp-arrow" class="pointer-line" marker-end="url(#arrow)"/>
    <path id="rbp-arrow" class="pointer-line" marker-end="url(#arrow)"/>
    <path id="saved-arrow" class="saved-line" marker-end="url(#red-arrow)"/>
    <path id="transfer" class="transfer-line" marker-end="url(#red-arrow)"/>
    <circle id="transfer-dot" r="6" fill="#e91c57" visibility="hidden"/>
    <text x="36" y="321" class="direction">← Рост стека</text>
    <text x="1254" y="321" class="direction" text-anchor="end">Адреса растут →</text>
    <text id="frame-caption" x="640" y="346" text-anchor="middle" class="caption"></text>
  </svg>
  <p id="explanation" class="explanation" aria-live="polite" aria-atomic="true"></p>
  <nav aria-label="Управление анимацией">
    <button id="reset" aria-label="В начало">↺</button>
    <button id="previous">← Назад</button>
    <button id="play" aria-pressed="false">▶ Воспроизвести</button>
    <button id="next">Вперёд →</button>
    <input id="position" type="range" min="0" value="0" aria-label="Шаг выполнения">
    <button id="source-toggle" aria-expanded="false">C++</button>
  </nav>
  <footer>Адреса и ширина ячеек условные · Серые ячейки уже вне активного стека · EDI/ESI/EAX — младшие 32 бита RDI/RSI/RAX · <a id="assembly-link">Ассемблер</a></footer>
  <pre id="source" hidden></pre>
  <noscript>Для анимации нужен JavaScript. Исходный код доступен в лекции.</noscript>
</main>
</body>
</html>

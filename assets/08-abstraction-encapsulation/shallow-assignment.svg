<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img"><title>Поверхностное присваивание: first теряет свой массив, и оба объекта указывают на массив second.</title><defs><marker id="b83a42" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b83a42"/></marker></defs><rect width="1100" height="400" rx="18" fill="white"/><text x="45" y="40" font-family="Arial, sans-serif" font-size="27" fill="#20303c" font-weight="700" text-anchor="start">После first = second</text><rect x="45" y="75" width="275" height="100" rx="15" fill="#f4f8fa" stroke="#b83a42" stroke-width="3"/><text x="67" y="114" font-family="Arial, sans-serif" font-size="28" fill="#b83a42" font-weight="700" text-anchor="start">first</text><text x="67" y="150" font-family="Arial, sans-serif" font-size="23" fill="#20303c" font-weight="400" text-anchor="start">data_ = second.data_</text><rect x="45" y="235" width="275" height="100" rx="15" fill="#f4f8fa" stroke="#b83a42" stroke-width="3"/><text x="67" y="274" font-family="Arial, sans-serif" font-size="28" fill="#b83a42" font-weight="700" text-anchor="start">second</text><text x="67" y="310" font-family="Arial, sans-serif" font-size="23" fill="#20303c" font-weight="400" text-anchor="start">data_ → массив на 20</text><text x="700" y="71" font-family="Arial, sans-serif" font-size="22" fill="#6b7785" font-weight="700" text-anchor="start">массив на 10 int</text><rect x="700" y="88" width="330" height="76" rx="12" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="10 7"/><path d="M 810 88 v 76 M 920 88 v 76" stroke="#9aa5b1" stroke-width="2"/><text x="755" y="137" font-family="Arial, sans-serif" font-size="29" fill="#6b7785" font-weight="400" text-anchor="middle">0</text><text x="865" y="137" font-family="Arial, sans-serif" font-size="29" fill="#6b7785" font-weight="400" text-anchor="middle">0</text><text x="975" y="137" font-family="Arial, sans-serif" font-size="29" fill="#6b7785" font-weight="400" text-anchor="middle">…</text><text x="700" y="198" font-family="Arial, sans-serif" font-size="22" fill="#6b7785" font-weight="400" text-anchor="start">утечка: адрес потерян</text><path d="M320 112 L690 120" fill="none" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="10 7"/><text x="505" y="128" font-family="Arial, sans-serif" font-size="36" fill="#b83a42" font-weight="700" text-anchor="middle">✕</text><text x="700" y="241" font-family="Arial, sans-serif" font-size="22" fill="#b83a42" font-weight="700" text-anchor="start">массив на 20 int</text><rect x="700" y="258" width="330" height="76" rx="12" fill="#e5f2f3" stroke="#b83a42" stroke-width="3"/><path d="M 810 258 v 76 M 920 258 v 76" stroke="#b83a42" stroke-width="2"/><text x="755" y="307" font-family="Arial, sans-serif" font-size="29" fill="#20303c" font-weight="400" text-anchor="middle">0</text><text x="865" y="307" font-family="Arial, sans-serif" font-size="29" fill="#20303c" font-weight="400" text-anchor="middle">0</text><text x="975" y="307" font-family="Arial, sans-serif" font-size="29" fill="#20303c" font-weight="400" text-anchor="middle">…</text><path d="M320 145 C520 150 520 285 690 290" fill="none" stroke="#b83a42" stroke-width="4" marker-end="url(#b83a42)"/><path d="M320 300 L690 302" fill="none" stroke="#b83a42" stroke-width="4" marker-end="url(#b83a42)"/><text x="700" y="372" font-family="Arial, sans-serif" font-size="22" fill="#b83a42" font-weight="400" text-anchor="start">два delete[] для одного массива</text></svg>

name: Check pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Примеры кода
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y clang-tidy-21

      - name: Compile, lint and measure examples
        env:
          CXX: clang++-21
          CLANG_TIDY: clang-tidy-21
        run: scripts/check-examples.sh

  markdown:
    name: Сноски и ссылки Godbolt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check reference links
        run: node scripts/check-markdown-refs.mjs

      - name: Check Godbolt links match the sources
        run: node scripts/update-godbolt-links.mjs --check

  render:
    name: Сборка сайта и слайдов
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Render Reveal.js presentations
        run: quarto render --profile slides --to revealjs

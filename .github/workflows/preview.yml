name: Preview Quarto site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Render Reveal.js presentations
        run: quarto render --profile slides --to revealjs

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
